name: Publish skill release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate repository and upload package
        run: python scripts/validate.py
      - name: Build upload-ready skill ZIP
        run: python scripts/package_skill.py
      - name: Verify release tag matches plugin version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          version = json.loads(
              Path(".codex-plugin/plugin.json").read_text(encoding="utf-8")
          )["version"]
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(
                  f"Release tag {os.environ['RELEASE_TAG']!r} must be {expected!r}"
              )
      - name: Publish permanent skill download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/paymob-integration.zip \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/paymob-integration.zip \
              --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
              --title "Paymob Integration Skill $RELEASE_TAG"
          fi

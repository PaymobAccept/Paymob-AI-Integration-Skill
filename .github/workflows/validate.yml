name: Validate plugin and skill

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate repository and upload package
        run: python scripts/validate.py
      - name: Build upload-ready skill ZIP
        run: python scripts/package_skill.py
      - name: Publish skill upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paymob-integration-skill-upload
          path: dist/paymob-integration.zip
          if-no-files-found: error
          retention-days: 14
